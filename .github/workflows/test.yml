name: test

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate client
        run: make generate

      - name: Check generated client freshness
        run: |
          if ! git diff --exit-code --stat -- 'client_gen_*' client_extensions_manifest.json; then
            echo "::error::Generated files differ from unified-openapi/openapi3.json; run 'make generate' and commit the result."
            exit 1
          fi
          untracked=$(git ls-files --others --exclude-standard -- 'client_gen_*')
          if [ -n "$untracked" ]; then
            echo "::error::Untracked generated files: $untracked"
            exit 1
          fi

      - name: Vet
        run: make vet

      - name: Build
        run: make build

      - name: Test
        run: make test
