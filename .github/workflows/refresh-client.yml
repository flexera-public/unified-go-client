name: refresh-client

# Weekly (or manually-triggered) refresh of the unified-openapi submodule and
# regeneration of client_gen.go from its latest merged spec. Any resulting
# changes are pushed to a long-lived branch and opened/updated as a pull
# request for manual review, mirroring the upstream refresh-specs.yml
# workflow in flexera-public/unified-openapi.

on:
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-client
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Update unified-openapi submodule to origin/main
        run: |
          git submodule update --init --recursive unified-openapi
          (cd unified-openapi && git fetch origin main && git reset --hard origin/main)

      - name: Regenerate client from updated spec
        run: make generate-client

      - name: Run tests
        run: make test

      - name: Build change summary
        id: summary
        run: |
          {
            echo "## Automated unified-openapi client refresh"
            echo ""
            echo "Generated by the [refresh-client](.github/workflows/refresh-client.yml) workflow."
            echo ""
            if git diff --quiet; then
              echo "_No changes detected upstream._"
            else
              echo "### Changed files"
              echo ""
              echo '```'
              git diff --stat
              echo '```'
            fi
          } > /tmp/pr-body.md

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: refresh unified-openapi submodule and regenerate client"
          branch: automated/refresh-client
          delete-branch: false
          title: "chore: automated unified-openapi client refresh"
          body-path: /tmp/pr-body.md
          add-paths: |
            unified-openapi
            client_gen.go
