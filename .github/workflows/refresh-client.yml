name: refresh-client

# Periodically pin the latest unified-openapi main snapshot, update Go
# dependencies, and regenerate client artifacts. Incompatible exported API
# changes are reported in the pull request, which is proposed for review.

on:
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-client
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      APIDIFF_VERSION: v0.0.0-20261014143641-f0251eb4aa3e
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Snapshot exported API before refresh
        run: go run golang.org/x/exp/cmd/apidiff@${APIDIFF_VERSION} -m -w /tmp/api-before.export .

      # Spec refresh and dependency updates run as separate stages so a failure
      # is attributable to one or the other.
      - name: Pin latest unified-openapi main snapshot
        run: make update-unified-openapi

      - name: Regenerate client from new snapshot
        run: make generate

      - name: Run tests (spec refresh)
        run: make test

      - name: Update Go dependencies
        run: make update-deps

      - name: Regenerate client with updated dependencies
        run: make generate

      - name: Run tests (dependency updates)
        run: make test

      - name: Detect incompatible API changes
        id: apidiff
        run: |
          go run golang.org/x/exp/cmd/apidiff@${APIDIFF_VERSION} -m -incompatible /tmp/api-before.export . > /tmp/apidiff.txt
          if [ -s /tmp/apidiff.txt ]; then
            echo "breaking=true" >> "$GITHUB_OUTPUT"
          else
            echo "breaking=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build change summary
        id: summary
        run: |
          {
            echo "## Automated dependency and client refresh"
            echo ""
            echo "Generated by the [refresh-client](.github/workflows/refresh-client.yml) workflow."
            echo ""
            if git diff --quiet; then
              echo "_No changes detected._"
            else
              echo "### Changed files"
              echo ""
              echo '```'
              git diff --stat
              echo '```'
            fi
            echo ""
            if [ "${{ steps.apidiff.outputs.breaking }}" = "true" ]; then
              echo "### :warning: Incompatible API changes ($(wc -l < /tmp/apidiff.txt) total)"
              echo ""
              echo "Downstream consumers (flexera-cli, terraform-provider-flexera) may need updates before bumping this client."
              echo ""
              echo '```'
              head -n 300 /tmp/apidiff.txt
              echo '```'
            else
              echo "_No incompatible exported API changes._"
            fi
          } > /tmp/pr-body.md

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: refresh unified-openapi snapshot and regenerate client"
          branch: automated/refresh-client
          delete-branch: false
          title: "chore: automated dependency and client refresh"
          body-path: /tmp/pr-body.md
          labels: ${{ steps.apidiff.outputs.breaking == 'true' && 'breaking-change' || '' }}
          add-paths: |
            unified-openapi
            scripts/update-unified-openapi
            go.mod
            go.sum
            client_gen_*.go
            client_gen_manifest.json
            client_extensions_manifest.json
