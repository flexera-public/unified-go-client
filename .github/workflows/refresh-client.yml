name: refresh-client

# Periodically update the unified-openapi submodule, Go dependencies, and
# generated client artifacts. The resulting changes are proposed for review.

on:
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-client
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Update unified-openapi submodule
        run: make update-submodule

      - name: Update dependencies and regenerate client
        run: make all

      - name: Run tests
        run: make test

      - name: Build change summary
        id: summary
        run: |
          {
            echo "## Automated dependency and client refresh"
            echo ""
            echo "Generated by the [refresh-client](.github/workflows/refresh-client.yml) workflow."
            echo ""
            if git diff --quiet; then
              echo "_No changes detected._"
            else
              echo "### Changed files"
              echo ""
              echo '```'
              git diff --stat
              echo '```'
            fi
          } > /tmp/pr-body.md

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: refresh unified-openapi and regenerate client"
          branch: automated/refresh-client
          delete-branch: false
          title: "chore: automated dependency and client refresh"
          body-path: /tmp/pr-body.md
          add-paths: |
            unified-openapi
            go.mod
            go.sum
            client_gen_*.go
            client_gen_manifest.json
