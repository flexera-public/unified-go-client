# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/HEAD/configuration-schema.json
output: .client_gen.tmp.go
package: flexera
generate:
  models: true
  client: true
  server-urls: true
compatibility:
  # Prefix every enum constant with its type name so generated identifiers do
  # not change when unrelated spec changes add or remove name collisions.
  always-prefix-enum-values: true
